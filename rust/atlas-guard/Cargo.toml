[package]
name = "atlas-guard"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "ATLAS security core: URL/IP gate, text and HTML sanitising, tokenising, secret redaction"

# Library first: the server, the fetcher and the browser all decide security the
# same way this crate does. The binary below is the same code with argv/stdin.
[lib]
name = "atlas_guard"
path = "src/lib.rs"

[[bin]]
name = "atlas-guard"
path = "src/main.rs"

[dependencies]

